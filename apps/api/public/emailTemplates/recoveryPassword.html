<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Recovery</title>
  </head>
  <body>
    <div style="text-align: center; margin-bottom: 24px">
      <strong></strong>
    </div>

    <div style="text-align: center">
      Hello,<br /><br />
      We received a request to reset your account password.<br />
      To continue, use the code below in the app:

      <div style="margin: 24px 0">
        <span style="font-size: 24px; font-weight: bold; letter-spacing: 4px"> {{code}} </span>
      </div>

      This code is valid for a few minutes.<br />
      If you did not request a password reset, you can safely ignore this email.

      <p>Best regards,<br />Zack Chuab</p>
    </div>
  </body>
</html>
